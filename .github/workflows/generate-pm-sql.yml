name: Generate PM SQL

on:
  schedule:
    # 09:00 Asia/Seoul
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/pm-sql/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: automation/pm-sql

      - name: Generate SQL file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          OUTPUT_DIR: ../../sql
        run: npm run generate:sql
        working-directory: automation/pm-sql

      - name: Upload generated SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-sql-${{ github.run_id }}
          path: sql/*.sql
          retention-days: 30

      - name: Commit generated SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql/*.sql
          if git diff --cached --quiet; then
            echo "No SQL changes to commit."
          else
            git commit -m "Add PM SQL for $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
